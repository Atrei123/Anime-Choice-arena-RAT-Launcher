name: Update Rating 24/7

on:
  schedule:
    - cron: '*/60 * * * *' # Запуск каждые 30 минут
  workflow_dispatch:      # Кнопка для ручного запуска в меню Actions

jobs:
  update:
    runs-on: ubuntu-latest
    # Даем права на запись в репозиторий, чтобы сохранять history.json
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Script
        run: node bot.js

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add history.json
          git commit -m "chore: update history.json [skip ci]" || echo "No changes to commit"
          git push
